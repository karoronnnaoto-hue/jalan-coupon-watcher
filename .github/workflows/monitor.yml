name: Monitor Jalan coupons

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      notify_existing:
        description: "初回から現在の該当クーポンを通知する"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jalan-coupon-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check coupons
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_EXISTING: ${{ inputs.notify_existing || 'false' }}
        run: |
          args=()
          if [[ "$NOTIFY_EXISTING" == "true" ]]; then
            args+=(--notify-existing)
          fi
          python jalan_coupon_bot.py --config config.example.json "${args[@]}"

      - name: Save notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update coupon state [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
